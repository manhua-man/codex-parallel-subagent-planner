name: CI Quality Gate

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Zero-Dependency Static Integrity Audit
        run: node .tools/check-drift.js

      - name: Run Validator Unit Tests
        run: node test/validator.test.js

      - name: Validate Example Plans
        run: |
          node .tools/validate-plan.js examples/plans/task-mode-plan.json
          node .tools/validate-plan.js examples/plans/project-mode-plan.json

      - name: Run Real Behavioral Evals
        run: node .tools/run-evals.js

      - name: Run Plugin Package Build
        run: node .tools/package-plugin.js
